# Keeps the SHA-pinned actions fresh: Dependabot opens a PR when an action
# releases a new version, updating the pinned SHA (and the # vX comment).
# Minor+patch bumps are grouped into one weekly PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
